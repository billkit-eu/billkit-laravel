name: CI

# Unit tests only. The integration suite is gated on
# BILLKIT_INTEGRATION_BASE_URL and skips itself here: it needs a live BillKit
# API, which is exercised in the private platform repo before a release is cut.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: ['highest']
        exclude:
          # Laravel 13 needs PHP 8.3.
          - php: '8.2'
            laravel: '13'
        include:
          # The floor of every constraint, so a lower bound that no longer
          # works fails here rather than in a user's `composer update`.
          - php: '8.2'
            laravel: '12'
            dependencies: 'lowest'
          - php: '8.3'
            laravel: '13'
            dependencies: 'lowest'
          - php: '8.4'
            laravel: '13'
            dependencies: 'highest'
            coverage: pcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: ${{ matrix.coverage || 'none' }}
          tools: composer:v2
      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --no-update --no-interaction --dev "orchestra/testbench:${{ matrix.laravel == '12' && '^10.0' || '^11.0' }}"
      - name: Install (${{ matrix.dependencies }})
        run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: PHPStan
        run: composer analyse
      - name: Code style
        run: composer cs:check
      - name: Test
        if: ${{ !matrix.coverage }}
        run: composer test
      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-text
